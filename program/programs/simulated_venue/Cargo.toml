[package]
name = "simulated_venue"
version = "0.1.0"
description = "Relay's simulated swap venue for devnet: a pool that swaps at a price its admin sets. Test tokens only."
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "simulated_venue"

[dependencies]
anchor-lang = "1.1.2"
anchor-spl = { version = "1.1.2", default-features = false, features = ["token"] }
solana-sysvar = "3.1"

[dev-dependencies]
serde_json = "1"
hex = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
