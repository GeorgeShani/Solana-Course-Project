[package]
name = "relay"
version = "0.1.0"
description = "Relay: append-only trade-plan commitments and verified follow receipts"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "relay"

[features]
default = []
# Build for Solana devnet: devnet USDC, one pair, and the simulated swap venue instead of Jupiter.
# Never combine with the default (test fork) build in one deployment.
devnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.1.2"
solana-sha256-hasher = "3.1"
solana-instructions-sysvar = "3.0"
anchor-spl = { version = "1.1.2", default-features = false, features = ["token", "token_2022"] }

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3"
serde_json = "1"
hex = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
