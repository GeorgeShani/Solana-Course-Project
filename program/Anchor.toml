skip_local_validator = true

[toolchain]

[features]
resolution = true
skip-lint = false

[workspace]
# Only relay is an Anchor program. mock_swap and cpi_attacker are test-only helpers built by `test`;
# simulated_venue is the devnet swap venue (a plain Solana program), built by `test` and, for a
# deployment, with `cargo build-sbf --manifest-path programs/simulated_venue/Cargo.toml`.
members = ["programs/relay"]

[programs.localnet]
relay = "GyfA1Cfni44zwHc5FB9nxtmMRhnLv5YtTY1KZY5NsK6F"

[programs.devnet]
relay = "GyfA1Cfni44zwHc5FB9nxtmMRhnLv5YtTY1KZY5NsK6F"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo build-sbf --manifest-path programs/mock_swap/Cargo.toml && cargo build-sbf --manifest-path programs/cpi_attacker/Cargo.toml && cargo build-sbf --manifest-path programs/simulated_venue/Cargo.toml && cargo build-sbf --manifest-path programs/relay/Cargo.toml --features devnet --sbf-out-dir ${CARGO_TARGET_DIR:-target}/deploy-devnet && cargo test && cargo test -p relay --features devnet"

[hooks]
