skip_local_validator = true

[toolchain]

[features]
resolution = true
skip-lint = false

[workspace]
# Only relay is an Anchor program. mock_swap and cpi_attacker are test-only helpers built by `test`.
members = ["programs/relay"]

[programs.localnet]
relay = "Dzm5tgMCdhJZfXeHYuALst4hvZYiCebfyKf1ctx6WBF6"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo build-sbf --manifest-path programs/mock_swap/Cargo.toml && cargo build-sbf --manifest-path programs/cpi_attacker/Cargo.toml && cargo test"

[hooks]
