# Whole stack on one origin: Caddy -> app (SSR) and server (Hono, under /api).
#
#   cp .env.example .env     # then edit
#   docker compose up -d --build
services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
      args:
        VITE_RPC_URL: ${VITE_RPC_URL:?set VITE_RPC_URL in .env}
        VITE_API_URL: /api
    restart: unless-stopped
    expose:
      - "3000"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: relay
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      # Must equal the browser origin exactly: the server rejects writes from any other origin.
      APP_ORIGIN: https://${DOMAIN}
      DATABASE_URL: postgres://relay:${POSTGRES_PASSWORD}@postgres:5432/relay
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-${VITE_RPC_URL}}
      SOLANA_CLUSTER: ${SOLANA_CLUSTER:-devnet}
      JUPITER_API_KEY: ${JUPITER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3001"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
      server:
        condition: service_healthy

volumes:
  pg_data:
  caddy_data:
  caddy_config:
